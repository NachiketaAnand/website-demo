<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

    <div id="login-screen">
        <h2>Enter your name</h2>
        <p>(This will be saved for this device)</p>
        <input id="name-input" type="text" placeholder="e.g., My Laptop" autocomplete="off" />
        <button id="join-btn">Join</button>
    </div>

    <div id="chat-screen">
        <div id="app-container">
            <div id="chat-container">
                <ul id="messages">
                    </ul>
                
                <button id="scroll-to-bottom" class="scroll-btn" title="Scroll to newest message">
                    &darr; 
                </button>
                
                <form id="form" action="">
                    <textarea id="input" autocomplete="off" placeholder="Paste your code here... (Enter to send, Shift+Enter for new line)"></textarea>
                    <button type="submit">Send</button>
                </form>

                <div id="file-form">
                    <input type="file" id="file-input" />
                    <button id="send-file-btn">Send File</button>
                    <span id="file-status"></span>
                </div>

            </div>
            
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
