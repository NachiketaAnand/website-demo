<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Code Share</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f4f4f4; }
        #login-screen { padding: 20px; text-align: center; margin-top: 50px; }
        #chat-screen { display: none; }
        #app-container { display: flex; flex-direction: row; height: 100vh; }
        #chat-container { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #user-list-container { width: 200px; min-width: 150px; background: #f0f0f0; border-left: 1px solid #ddd; padding: 10px; box-sizing: border-box; height: 100vh; overflow-y: auto; }
        #user-list-container h2 { margin-top: 0; font-size: 1.1em; }
        #user-list { list-style-type: none; padding: 0; margin: 0; }
        #user-list li { padding: 5px 0; border-bottom: 1px solid #eee; }
        #messages { list-style-type: none; margin: 0; padding: 0; flex-grow: 1; overflow-y: scroll; border: 1px solid #ddd; background: #fff; padding: 10px; border-radius: 8px; }
        #messages li { padding: 8px 12px; margin-bottom: 10px; position: relative; }
        #messages li.notification { font-style: italic; color: #888; text-align: center; }
        pre { background: #2d2d2d; color: #f1f1f1; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre; position: relative; }
        code { font-family: "Courier New", Courier, monospace; }
        
        /* --- BUTTON STYLES --- */
        .btn { border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; color: white; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: #555; }
        .copy-btn:hover { background: #777; }
        
        .admin-btn { display: none; font-size: 0.8em; padding: 3px 6px; }
        .delete-btn { position: absolute; top: 5px; right: 60px; background: #d93025; }
        .delete-btn:hover { background: #a52714; }
        .edit-btn { position: absolute; top: 5px; right: 110px; background: #007aff; }
        .edit-btn:hover { background: #0056b3; }
        
        body.is-admin .admin-btn { display: inline-block; }

        /* --- DELETED MESSAGE STYLE --- */
        .is-deleted pre { background: #f0f0f0; }
        .is-deleted code { color: #888; font-style: italic; }
        .is-deleted .copy-btn, .is-deleted .admin-btn { display: none; } /* Hide buttons */

        /* --- EDITING STYLES --- */
        .edit-container { display: none; }
        .edit-textarea { width: 98%; min-height: 80px; margin-top: 5px; font-family: "Courier New", monospace; }
        .save-btn { background: #28a745; margin-right: 5px; }
        .cancel-btn { background: #888; }
        
        /* When 'is-editing', hide display and show edit-container */
        .is-editing .display-container { display: none; }
        .is-editing .edit-container { display: block; }
        
        /* --- FORM --- */
        #form { display: flex; margin-top: 10px; }
        #input { flex-grow: 1; border: 1px solid #ddd; padding: 10px; border-radius: 5px; min-height: 50px; resize: vertical; }
        #form button { background: #007aff; color: white; border: none; padding: 10px 15px; border-radius: 5px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Enter your name</h2>
        <p>(This will be saved for this device)</p>
        <input id="name-input" type="text" placeholder="e.g., My Laptop" autocomplete="off" />
        <button id="join-btn">Join</button>
    </div>

    <div id="chat-screen">
        <div id="app-container">
            <div id="chat-container">
                <ul id="messages"></ul>
                <form id="form" action="">
                    <textarea id="input" autocomplete="off" placeholder="Paste your code here..."></textarea>
                    <button>Send</button>
                </form>
            </div>
            <div id="user-list-container">
                <h2>Online</h2>
                <ul id="user-list"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // --- Get HTML elements ---
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const joinBtn = document.getElementById('join-btn');
        const nameInput = document.getElementById('name-input');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const userList = document.getElementById('user-list');

        const socket = io("https://code-share-backend-vwwx.onrender.com");
        let myName = '';
        const ADMIN_KEY_STORAGE = 'codeShareAdminKey';

        // --- (Copy Helper Function) ---
        function fallbackCopyTextToClipboard(text, buttonElement) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful && buttonElement) {
                    buttonElement.textContent = 'Copied!';
                    setTimeout(() => { buttonElement.textContent = 'Copy'; }, 2000);
                }
            } catch (err) { console.error('Fallback copy failed: ', err); }
            document.body.removeChild(textArea);
        }

        // --- (Display Message Helper Function) ---
        // This function is now much more complex
        function displayCodeMessage(data) {
            const item = document.createElement('li');
            item.dataset.id = data.id; // Store the message ID
            
            if (data.isDeleted) {
                item.classList.add('is-deleted');
            }
            
            const nameSpan = document.createElement('strong');
            nameSpan.textContent = data.name;
            item.appendChild(nameSpan);

            // --- Part 1: The Display Container (Visible by default) ---
            const displayContainer = document.createElement('div');
            displayContainer.className = 'display-container';

            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = data.code; 
            
            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'Copy';
            copyBtn.className = 'btn copy-btn';
            copyBtn.onclick = () => {
                fallbackCopyTextToClipboard(data.code, copyBtn);
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'btn admin-btn delete-btn';
            deleteBtn.onclick = () => {
                if (confirm('Are you sure you want to delete this message?')) {
                    socket.emit('deleteMessage', data.id);
                }
            };
            
            const editBtn = document.createElement('button');
            editBtn.textContent = 'Edit';
            editBtn.className = 'btn admin-btn edit-btn';

            pre.appendChild(code);
            pre.appendChild(copyBtn);
            pre.appendChild(deleteBtn);
            pre.appendChild(editBtn);
            displayContainer.appendChild(pre);
            item.appendChild(displayContainer);
            
            // --- Part 2: The Edit Container (Hidden by default) ---
            const editContainer = document.createElement('div');
            editContainer.className = 'edit-container';
            
            const editTextArea = document.createElement('textarea');
            editTextArea.className = 'edit-textarea';
            editTextArea.value = data.code;
            
            const saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save';
            saveBtn.className = 'btn save-btn';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'btn cancel-btn';

            editContainer.appendChild(editTextArea);
            editContainer.appendChild(saveBtn);
            editContainer.appendChild(cancelBtn);
            item.appendChild(editContainer);

            // --- Button Click Logic ---
            editBtn.onclick = () => {
                item.classList.add('is-editing');
            };
            
            cancelBtn.onclick = () => {
                item.classList.remove('is-editing');
                editTextArea.value = data.code; // Reset text
            };
            
            saveBtn.onclick = () => {
                const newCode = editTextArea.value;
                socket.emit('editMessage', {
                    messageId: data.id,
                    newCode: newCode
                });
                // No need to change UI here, the 'loadHistory'
                // event will come from the server and rebuild it.
            };

            // Highlight syntax
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(code);
            }
            
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        // --- (Notification Helper Function) ---
        function showNotification(msg) {
            const item = document.createElement('li');
            item.className = 'notification';
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        // --- (Join Chat Helper Function) ---
        function joinChat(name) {
            myName = name;
            localStorage.setItem('codeShareName', myName);

            let adminKey = localStorage.getItem(ADMIN_KEY_STORAGE);
            if (!adminKey) {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('admin')) {
                    adminKey = prompt("Enter Admin Key:");
                    if (adminKey) {
                        localStorage.setItem(ADMIN_KEY_STORAGE, adminKey);
                    }
                }
            }
            
            socket.emit('join', {
                name: myName,
                adminKey: adminKey
            });

            loginScreen.style.display = 'none';
            chatScreen.style.display = 'block';
            input.focus();
        }

        // --- Page Load Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('codeShareName');
            if (savedName) {
                nameInput.value = savedName;
                joinChat(savedName);
            } else {
                loginScreen.style.display = 'block';
            }
        });

        // --- Event Listeners (Sending data) ---
        joinBtn.onclick = () => {
            const name = nameInput.value.trim();
            if (name) {
                joinChat(name);
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('sendCode', { code: input.value });
                input.value = '';
            }
        });

        // --- Socket Listeners (Receiving data) ---

        // THIS IS NOW THE MAIN RENDER FUNCTION
        socket.on('loadHistory', (history) => {
            messages.innerHTML = ''; // Clear everything
            history.forEach(data => displayCodeMessage(data));
        });

        // This just appends a new message
        socket.on('newCode', (data) => {
            displayCodeMessage(data);
        });

        socket.on('adminStatus', (data) => {
            if (data.isAdmin) {
                console.log('Admin status confirmed.');
                document.body.classList.add('is-admin');
            } else {
                localStorage.removeItem(ADMIN_KEY_STORAGE);
            }
        });

        socket.on('userJoined', (msg) => showNotification(msg));
        socket.on('userLeft', (msg) => showNotification(msg));

        socket.on('updateUserList', (users) => {
            userList.innerHTML = '';
            users.forEach(name => {
                const item = document.createElement('li');
                item.textContent = name;
                userList.appendChild(item);
            });
        });

    </script>
</body>
</html>
